# Lima configuration for macOS 27 guest VM
#
# The account is created by Apple's native first-boot provisioning
# (VZMacGuestProvisioningOptions, from the lima-devl P1 patch) instead of Lima's fake
# cloud-init, so this needs a macOS 27 host AND guest. The host-side tweaks (wallpaper,
# energy settings, TCC) are applied by tools/macos-setup after the build.
#
# Requirements:
#   - Apple Silicon Mac (aarch64) — macOS guests only run on native arch via VZ
#   - macOS 27 host AND guest (provisioning is skipped with a warning otherwise)
#   - lima-devl with the P1 guest provisioning patch
#
# Usage (the initial password is never stored in this public repo; make picks a random
# one; if MACOS_PASSWORD is exported, make sets it as the account password afterwards):
#   make rebuild-27
# or by hand:
#   limactl create --name=macos-27 \
#     --set '.osOpts.Darwin.guestProvisioning.password = "..."' \
#     ./macos-27.yaml
#   (limactl disables yq's strenv(), so the value must be a literal string.)
#   limactl start macos-27
#
# Apple Software License Agreement applies:
#   https://www.apple.com/legal/sla/
#
# ── Known caveats (Lima 2.1) ──────────────────────────────────────────────────
#   • No support for turning off the video display — always runs with a window.
#   • No automatic port forwarding — use `ssh -L` for manual tunnels, or rely
#     on the vzNAT IP to reach guest ports directly from the host.
#   • No support for custom caCerts.
#   • Password-less sudo is disabled inside the guest (except shutdown).
#   Ref: https://lima-vm.io/docs/usage/guests/macos/

minimumLimaVersion: "2.1.0"

# ── Image ──────────────────────────────────────────────────────────────────────

images:
- location: "https://updates.cdn-apple.com/2026FallFCS/59241290-5d51-4ca8-9df4-31624b9a4eac/UniversalMac_27.0.1_26A434_Restore.ipsw"
  arch: "aarch64"

# macOS guests require VZ (Apple Virtualization.framework) — QEMU is not supported
vmType: "vz"
os: "Darwin"
arch: "aarch64"

containerd:
  system: false
  user: false

# Name the provisioned account like the host user (and like the 15/26 VMs). lima-devl's
# default for provisioned accounts is <host user>.guest so the home cannot clash with a
# mounted host home; nothing here mounts one, so the plain name is fine. Setup Assistant
# creates the home as /Users/blake.
user:
  name: blake

# ── Resources ──────────────────────────────────────────────────────────────────

# Tune these to match your workload and available host resources.
cpus: 16
memory: "32GiB"
disk: "128GiB"

# ── Display ────────────────────────────────────────────────────────────────────

# The macOS installer requires a display device. Turning it off is not supported
# for macOS guests — "default" is the only practical choice here.
video:
  display: "default"

# ── Audio ──────────────────────────────────────────────────────────────────────

audio:
  # Pass audio through to the host via Virtualization.framework.
  # Set to "" to mute / disable audio.
  device: "vz"

# ── SSH ────────────────────────────────────────────────────────────────────────

ssh:
  # Agent forwarding is disabled for macOS guests. Lima's forwarding mechanism
  # creates a socket at /run/host-services/ssh-auth.sock which is a sealed
  # read-only path on macOS, causing a fatal degraded-mode error on first boot.
  # SSH access uses authorized_keys configured by configure.sh instead.
  forwardAgent: false
  # Also load ~/.ssh/*.pub so tools like rsync work without extra config.
  loadDotSSHPubKeys: true

# ── Networking ─────────────────────────────────────────────────────────────────

networks:
  # vzNAT gives the VM a routable IP accessible from the host (but not other guests).
  # Requires vmType: vz; no extra daemons needed.
  - vzNAT: true

# ── Filesystem mounts ──────────────────────────────────────────────────────────

# virtiofs is the default and fastest mount type for VZ instances.
mountType: "virtiofs"

mounts:
  # lima_mac project directory mounted read-write for VM testing and development.
  - location: "~/Developer/lima_mac"
    mountPoint: "/Volumes/lima_mac"
    writable: true

# ── Advanced VZ options ────────────────────────────────────────────────────────

vmOpts:
  vz:
    # "asif" is a sparse, copy-on-write disk format available on macOS 26+.
    # It saves significant disk space vs "raw". Cannot be converted back to "raw".
    # Set to "raw" if you need compatibility with older tooling.
    diskImageFormat: "asif"

    # Rosetta is only useful for Linux guests running x86_64 binaries.
    # Leave disabled for a macOS guest.
    rosetta:
      enabled: false
      binfmt: false
    guestPatch:
        tccPermissions:
         - preset: sshd-full-disk-access
         - preset: lima-guestagent-full-disk-access
         - preset: terminal-accessibility

# suppressFirstLoginSetup moved from vmOpts.vz to osOpts.Darwin per upstream
# maintainer feedback on lima-vm/lima#5186.
osOpts:
  Darwin:
    suppressFirstLoginSetup: true
    # Native first-boot account provisioning (macOS 27 host + guest, lima-devl P1).
    # macOS applies this only on the first boot after install, so it takes effect
    # on a fresh create, never on an existing instance. The account is named by user.name
    # (blake, set above) with the host user's full name (user.comment); Setup Assistant
    # creates its home at /Users/<user.name>. Only the initial password is set, at create time (see Usage above).
    guestProvisioning:
      logsInAutomatically: true
      enablesRemoteLogin: true

# Nested virtualisation lets you run another hypervisor inside this VM.
# Requires Apple M3 or later.
# nestedVirtualization: true

# ── Provisioning ──────────────────────────────────────────────────────────────

provision:
  # Sudo askpass helper — required by any provision script that needs sudo.
  # Lima stores the guest password at ~/password (here the provisioning password,
  # i.e. /Users/${USER}/password). This script reads it so that
  # SUDO_ASKPASS can supply the password non-interactively.
  # The guest password should be changed after first login.
  - mode: data
    path: /usr/local/bin/lima-sudo-askpass.sh
    permissions: 755
    content: |
      #!/bin/sh
      set -eu
      cat "$HOME/password"

  # Enable passwordless sudo for admin users via sudoers.d.
  # This allows provisioning scripts to run sudo commands without prompting for a password.
  # Must use `sudo -A` so that SUDO_ASKPASS is actually consulted (plain sudo ignores it).
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      export SUDO_ASKPASS=/usr/local/bin/lima-sudo-askpass.sh
      if ! [[ -f /etc/sudoers.d/admin ]]; then
        echo "Granting all admin users nopasswd sudo access..."
        echo "%admin ALL=(ALL) NOPASSWD:ALL" | sudo -A tee /etc/sudoers.d/admin
      fi

  # Apply dotfiles via chezmoi (https://chezmoi.io).
  # This runs the configure.sh script which handles all VM configuration.
  # The script is idempotent — safe to re-run on restart.
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      /Volumes/lima_mac/configure.sh

# ── Port forwarding ────────────────────────────────────────────────────────────

# NOTE: Automatic port forwarding is NOT supported for macOS guests.
# To reach a port running in the guest, either:
#   a) Use the vzNAT IP directly (find it with `limactl shell macos-27 ipconfig getifaddr en0`)
#   b) Set up a manual tunnel: ssh -F ~/.lima/macos-27/ssh.config lima-macos-27 -L 8080:localhost:8080 -N

# ── Message shown after `limactl start` ───────────────────────────────────────

message: |
  macOS 27 VM is ready.

  SSH into the guest:
    limactl shell {{.Name}}

  Check that first-boot provisioning ran (marker is removed after the first boot):
    ls ~/.lima/{{.Name}}/vz-guest-provisioning   # should not exist
    limactl shell {{.Name}} dscl . -read /Users/${USER} RealName NFSHomeDirectory

  Read the account's GUI session password:
    limactl shell {{.Name}} cat /Users/${USER}/password
